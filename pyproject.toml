[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sls-scan"
version = "0.0.1"
description = "A structured-light 3D scanner from a camera and a projector, scripted on Linux"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.10",
    "open3d>=0.18",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slscan = "slscan.cli:main"

[tool.setuptools.packages.find]
include = ["slscan*"]

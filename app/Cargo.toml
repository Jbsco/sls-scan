[package]
name = "sls-scan-app"
version = "0.0.1"
edition = "2021"
rust-version = "1.93"
license = "GPL-3.0-or-later"
description = "Application of the sls-scan structured-light scanner"
publish = false

[lib]
name = "slscan_app"
path = "src/lib.rs"

[[bin]]
name = "sls-scan"
path = "src/main.rs"

[dependencies]
eframe = "0.34.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
png = "0.18"
pollster = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"

name: Style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  style:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the markdown renderer
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y discount

      - name: Run style gate
        run: |
          set -o pipefail
          bash style.do 2>&1 | tee style-output.log
          grep -q "style: all checks clean" style-output.log

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package with its test extras
        if: runner.environment == 'github-hosted'
        run: pip install -e '.[dev]'

      - name: Run test gate
        run: bash test.do
